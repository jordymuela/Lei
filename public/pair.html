<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lei</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#C2463A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap">
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/js/pair.js"></script>
</head>
<body>
<main class="pair">
  <h1 class="name">lei</h1>
  <h2 class="q" data-i18n="pair.title">Pair this device</h2>
  <p class="qhint" data-i18n="pair.intro">On your Mac, open Lei, then Settings → Devices → Add a device. Enter the code it shows.</p>
  <form id="pairForm" autocomplete="off">
    <label class="sr" for="code" data-i18n="pair.code">Code</label>
    <input class="line-input code-input" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123 456" required>
    <label class="sheet-note" for="deviceName" data-i18n="pair.name">Name for this device</label>
    <input class="line-input small" id="deviceName" maxlength="40">
    <button class="pill" id="pairBtn" type="submit" data-i18n="pair.button">Pair</button>
    <p class="sheet-note" id="pairMsg" role="status"></p>
  </form>
</main>
</body>
</html>
